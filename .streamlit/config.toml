[server]
port = 8501
enableCORS = true
# Serves ./static at /app/static/ (used for the iPhone home-screen icon).
enableStaticServing = true


[client]
# Viewer menu only: just the Get Help / Report a bug / About items from
# st.set_page_config. Hides Rerun, Settings (light/dark theme), Print, Record a
# screencast, Clear cache and the Deploy button.
toolbarMode = "minimal"


[theme]
base="light"
primaryColor="#0B6BCB"
backgroundColor="#F4F9FF"
secondaryBackgroundColor="#EAF4FF"
textColor="#0D2440"

[browser]
gatherUsageStats = false
# Must use the same host as auth.redirect_uri in secrets.toml, otherwise the
# Google sign-in cookie is set on one host and the callback arrives on the
# other (dashboard.py also redirects mismatched hosts before sign-in).
serverAddress = "127.0.0.1"
serverPort = 8501
